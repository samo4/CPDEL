name: Build and Deploy OTA Firmware

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  PROJECT_DIR: firmware_sousim_2
  ESP_IDF_VERSION: v6.0

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget flex bison gperf python3-venv

      - name: Install ESP-IDF and Build firmware
        run: |
          # Upgrade host pip tooling first.
          python -m pip install --upgrade pip setuptools wheel

          git clone -b "${{ env.ESP_IDF_VERSION }}" --depth 1 https://github.com/espressif/esp-idf.git esp-idf
          cd esp-idf

          # Install IDF tools + Python env.
          ./install.sh esp32s2
          source ./export.sh

          # Guardrail: ensure we are really on ESP-IDF 6.x.
          IDF_VER="$(idf.py --version)"
          echo "Using $IDF_VER"
          echo "$IDF_VER" | grep -E "ESP-IDF v6\.|v6\." >/dev/null || {
            echo "ERROR: Expected ESP-IDF 6.x, got: $IDF_VER"
            exit 1
          }

          # Fix pkg_resources import in IDF virtualenv on some runners.
          python -m ensurepip --upgrade || true
          python -m pip install --upgrade pip setuptools wheel
          python -c "import pkg_resources; print('pkg_resources OK')"

          cd ${{ github.workspace }}/${{ env.PROJECT_DIR }}/esp
          idf.py build

          # Find the firmware binary
          FW_BIN=$(find . -name "firmware.bin" -o -name "*.bin" | grep -E "(firmware|app)" | head -1)
          if [ -z "$FW_BIN" ]; then
            echo "Error: No firmware binary found"
            find . -name "*.bin" -type f
            exit 1
          fi

          echo "Found firmware: $FW_BIN"
          echo "FIRMWARE_BIN=${{ github.workspace }}/${{ env.PROJECT_DIR }}/esp/$FW_BIN" >> $GITHUB_ENV
          echo "BUILD_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV
          echo "FIRMWARE_SHA256=$(sha256sum "$FW_BIN" | cut -d' ' -f1)" >> $GITHUB_ENV

      - name: Create OTA artifacts
        run: |
          VERSION="${{ github.ref_name }}"
          ARTIFACT_DIR="${{ env.PROJECT_DIR }}/ota-artifacts/${VERSION}"
          mkdir -p "${ARTIFACT_DIR}"

          # Copy firmware
          cp "${{ env.FIRMWARE_BIN }}" "${ARTIFACT_DIR}/firmware.bin"

          # Get firmware size
          FIRMWARE_SIZE=$(stat -c%s "${ARTIFACT_DIR}/firmware.bin")

          # Generate manifest.json
          cat > "${ARTIFACT_DIR}/manifest.json" <<EOF
          {
            "version": "${VERSION}",
            "timestamp": "${{ env.BUILD_TIMESTAMP }}",
            "firmware": {
              "filename": "firmware.bin",
              "sha256": "${{ env.FIRMWARE_SHA256 }}",
              "size": ${FIRMWARE_SIZE},
              "buildNumber": ${{ github.run_number }}
            },
            "device": {
              "modelName": "Universal DC Load Simulator",
              "minFirmwareVersion": "1.0.0",
              "interface": "HTTP/WebSocket"
            }
          }
          EOF

          # Generate update-info.json (compact format for device)
          cat > "${ARTIFACT_DIR}/update-info.json" <<EOF
          {
            "latestVersion": "${VERSION}",
            "url": "https://github.com/${{ github.repository }}/releases/download/${VERSION}/firmware.bin",
            "checksum": "${{ env.FIRMWARE_SHA256 }}",
            "timestamp": "${{ env.BUILD_TIMESTAMP }}"
          }
          EOF

          # Create release notes from git tag message
          git tag -l "${{ github.ref_name }}" --format='%(contents)' > "${ARTIFACT_DIR}/RELEASE_NOTES.txt" || echo "Release ${{ github.ref_name }}" > "${ARTIFACT_DIR}/RELEASE_NOTES.txt"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ env.PROJECT_DIR }}/ota-artifacts/${{ github.ref_name }}/firmware.bin
            ${{ env.PROJECT_DIR }}/ota-artifacts/${{ github.ref_name }}/manifest.json
            ${{ env.PROJECT_DIR }}/ota-artifacts/${{ github.ref_name }}/update-info.json
          body_path: ${{ env.PROJECT_DIR }}/ota-artifacts/${{ github.ref_name }}/RELEASE_NOTES.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post-deploy status
        if: success()
        run: |
          echo "✅ OTA build and deploy successful!"
          echo "📦 Version: ${{ github.ref_name }}"
          echo "🔗 GitHub Release: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
          echo "📝 Firmware SHA256: ${{ env.FIRMWARE_SHA256 }}"
