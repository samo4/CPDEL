name: Image metadata guard

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  gps-metadata:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Pillow
        run: python -m pip install --quiet --upgrade pillow

      - name: Reject images with GPS metadata
        run: python .github/scripts/check_image_metadata.py
