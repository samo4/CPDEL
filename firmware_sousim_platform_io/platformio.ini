; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32s2ucp]
platform = espressif32
board = esp32-s2-ucp
framework = arduino
extra_scripts = pre:tools/pre_build.py
board_build.partitions = ucp.csv
lib_compat_mode = strict
lib_deps =
	WiFi
	Update
	FS
	ayushsharma82/ElegantOTA@^3.1.6
	ayushsharma82/ESP-DASH@^4.0.8
  lvgl/lvgl@^9.2.2
  TFT_eSPI
  adafruit/Adafruit FT6206 Library@^1.1.0
build_flags =
    -DELEGANTOTA_USE_ASYNC_WEBSERVER=1
    -DCONFIG_ASYNC_TCP_MAX_ACK_TIME=3000
    -DCONFIG_ASYNC_TCP_PRIORITY=10
    -DCONFIG_ASYNC_TCP_QUEUE_SIZE=128
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=1
    -DCONFIG_ASYNC_TCP_STACK_SIZE=4096
    -I files/include
    -DLV_CONF_PATH=../../../../include/lv_conf.h
    -D USER_SETUP_LOADED=1  ; TFT_eSPI library
    ;-D ILI9341_DRIVER=1                           ; ???
    ;-D TFT_WIDTH=128                              ; Set TFT size
    ;-D TFT_HEIGHT=160
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=0
    -D TFT_DC=2                                  ; Data/Comand pin
    -D TFT_RST=13                                ; Reset pin
    -D SPI_FREQUENCY=27000000                    ; SPI speed    40000000
monitor_speed = 921600
monitor_port = COM14
